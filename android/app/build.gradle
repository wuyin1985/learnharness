plugins {
    id 'com.android.application' version '9.2.1'
}

def projectVersion = new groovy.json.JsonSlurper()
    .parse(rootProject.file('../package.json')).version
def versionParts = projectVersion.tokenize('.').collect { it.toInteger() }
def runtimeDir = layout.buildDirectory.dir('generated/learnharness')

android {
    namespace 'ai.learnharness.android'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.learnharness.android'
        minSdk 28
        targetSdk 35
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName projectVersion
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDir(runtimeDir.get().dir('assets').asFile)
            jniLibs.srcDir(runtimeDir.get().dir('jniLibs').asFile)
            res.srcDir(runtimeDir.get().dir('res').asFile)
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }
    androidResources { noCompress += 'zip' }
}

tasks.register('verifyEngine') {
    doLast {
        if (!runtimeDir.get().file('assets/runtime.zip').asFile.isFile()
            || !runtimeDir.get().file('assets/runtime.id').asFile.isFile()
            || !runtimeDir.get().dir('jniLibs').asFile.isDirectory()) {
            throw new GradleException('Run python android/prepare-runtime.py from the repository root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyEngine') }
